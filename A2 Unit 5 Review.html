    "x = \\frac{-3 \\pm \\sqrt{3^2 - 4(-6)(2)}}{2(-6)}"
   ],
   [
    3,
    "Simplify the discriminant",
    "3² = 9 and −4(−6)(2) = +48. 9 + 48 = <b>57</b>. Bottom: 2(−6) = −12.",
    "x = \\frac{-3 \\pm \\sqrt{\\color{#D98A14}{57}}}{-12}"
   ],
   [
    3,
    "Split into two fractions",
    "Both terms of the numerator are over the same denominator, −12.",
    "x = \\frac{-3}{-12} \\pm \\frac{\\sqrt{57}}{-12}"
   ],
   [
    3,
    "Simplify each fraction",
    "−3/−12: divide the top and bottom by <b>−3</b> → 1/4. √57/(−12) = −√57/12, and ± with a minus sign is still ±. 57 = 3 · 19 has no prime squared, so √57 stays.",
    "x = \\frac{1}{4} \\pm \\frac{\\sqrt{57}}{12}"
   ]
  ],
  "ans": "x = \\frac{1}{4} \\pm \\frac{\\sqrt{57}}{12}"
 },
 "31": {
  "k": "qf",
  "eq": "x^2 + 2x = 4x",
  "steps": [
   [
    0,
    "Write in standard form",
    "Subtract 4x from both sides so one side is 0: 2x − 4x = −2x.",
    "x^2 + 2x - 4x = 0 \\;\\Rightarrow\\; x^2 - 2x = 0"
   ],
   [
    1,
    "Identify a, b, and c",
    "There is no constant term, so <b>c = 0</b>.",
    "a = 1,\\quad b = -2,\\quad c = \\color{#D98A14}{0}"
   ],
   [
    2,
    "Substitute into the formula",
    "Put b = −2 in parentheses.",
    "x = \\frac{-(-2) \\pm \\sqrt{(-2)^2 - 4(1)(0)}}{2(1)}"
   ],
   [
    3,
    "Simplify the discriminant",
    "(−2)² = 4 and 4(1)(0) = 0. Then 4 = 2 · 2 = <b>2²</b>, and √(2²) = 2.",
    "x = \\frac{2 \\pm \\sqrt{4}}{2} = \\frac{2 \\pm \\sqrt{\\color{#D98A14}{2^2}}}{2} = \\frac{2 \\pm 2}{2}"
   ],
   [
    3,
    "Work out each sign",
    "(2 + 2)/2 = 2 and (2 − 2)/2 = 0.",
    "x = \\frac{4}{2} = 2 \\quad\\text{or}\\quad x = \\frac{0}{2} = 0"
   ]
  ],
  "ans": "x = 2 \\quad\\text{or}\\quad x = 0"
 }
};
const IDS = Object.keys(P).map(Number).sort((a,b)=>a-b);
const KINDS = {
  rad:{label:"Simplify radicals", range:"1–9", intro:"Simplify the expression", phases:["Multiply","Find perfect squares","Simplify"], ansTitle:"Answer", ref:"Original expression"},
  sqrt:{label:"Solve by square roots", range:"10–13", intro:"Solve by taking the square root of both sides", phases:["Isolate the square","Take the square root","Solve"], ansTitle:"Solution", ref:"Original equation"},
  cx:{label:"Complex numbers", range:"14–22", intro:"Simplify. Write the answer as a + bi", phases:["Simplify"], ansTitle:"Answer", ref:"Original expression"},
  cts:{label:"Solve by completing the square", range:"23–25", intro:"Solve by completing the square", phases:["Set up","Regroup","Factor out a","Complete the square","Factor the trinomial","Square root property"], ansTitle:"Solution", ref:"Original equation"},
  vtx:{label:"Vertex form", range:"26–28", intro:"Write in vertex form by completing the square. Find the vertex and the max or min", phases:["Regroup","Factor out a","Complete the square","Vertex form","Vertex & max/min"], ansTitle:"Vertex form, vertex, and max/min", ref:"Original equation"},
  qf:{label:"Quadratic formula", range:"29–31", intro:"Solve using the Quadratic Formula", phases:["Standard form","Find a, b, c","Substitute","Simplify"], ansTitle:"Solution", ref:"Original equation"}
};

let cur = IDS[0], step = 0; // step 0 = problem page, 1..n = steps, n+1 = answer
let done = new Set();
try{ const s = JSON.parse(localStorage.getItem("a2u5review-done")||"[]"); s.forEach(n=>done.add(n)); }catch(e){}
function saveDone(){ try{ localStorage.setItem("a2u5review-done", JSON.stringify([...done])); }catch(e){} }

const $ = id => document.getElementById(id);
const picker = $("picker"), phasesEl = $("phases");

Object.entries(KINDS).forEach(([k,info])=>{
  const g=document.createElement("div"); g.className="group";
  g.innerHTML=`<span class="glbl">${info.label} <span class="grng">${info.range}</span></span>`;
  const row=document.createElement("div"); row.className="chips";
  IDS.filter(n=>P[n].k===k).forEach(n=>{
    const b = document.createElement("button");
    b.className="chip"; b.type="button"; b.id="chip-"+n;
    b.addEventListener("click",()=>go(n,0));
    row.appendChild(b);
  });
  g.appendChild(row); picker.appendChild(g);
});

let shownPh=null;
function buildPhases(ph){
  if(shownPh===ph) return; shownPh=ph;
  phasesEl.innerHTML=""; phasesEl.style.setProperty("--cols", ph.length);
  ph.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="phase"; d.id="ph"+i;
    d.innerHTML=`<div class="bar"></div><span>${p}</span>`; phasesEl.appendChild(d);
  });
}

function typeset(els){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.startup.promise.then(()=>{ MathJax.typesetClear(els); return MathJax.typesetPromise(els); }).catch(()=>{});
  }
}

function render(){
  const pr = P[cur], n = pr.steps.length, K = KINDS[pr.k], PH = pr.phases || K.phases;
  buildPhases(PH);
  IDS.forEach(k=>{
    const b=$("chip-"+k);
    b.setAttribute("aria-current", k===cur ? "true":"false");
    b.innerHTML = k + (done.has(k) ? '<span class="tick" aria-label="done">✓</span>' : '');
  });
  const card=$("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  const math=$("math"), ref=$("ref");
  math.className="math";
  let phase=-1;

  if(step===0){
    $("eyebrowL").textContent=`Problem ${cur}`;
    $("eyebrowR").textContent=`${n} steps`;
    $("title").textContent=pr.intro || K.intro;
    $("note").innerHTML=`Try the first step on paper, then press <b style="color:var(--accent)">Next</b> to check it.`;
    math.classList.add("big");
    math.innerHTML=`\\[${pr.eq}\\]`;
    ref.innerHTML = pr.k==="qf" ? `Quadratic Formula: <span class="m">\\(x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}\\)</span>` : "";
  } else if(step<=n){
    const [ph,t,note,tex]=pr.steps[step-1]; phase=ph;
    $("eyebrowL").textContent=`Problem ${cur} · ${PH[ph]}`;
    $("eyebrowR").textContent=`Step ${step} of ${n}`;
    $("title").textContent=t;
    $("note").innerHTML=note;
    math.innerHTML=`\\[${tex}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
  } else {
    phase=PH.length;
    $("eyebrowL").textContent=`Problem ${cur} · Done`;
    $("eyebrowR").textContent=`Done`;
    $("title").textContent=K.ansTitle;
    const nextId = IDS[IDS.indexOf(cur)+1];
    $("note").innerHTML = nextId ? `Nice work. Press <b style="color:var(--accent)">Next problem</b> to go on to problem ${nextId}, or pick any problem above.` : `That was the last problem. Pick any problem above to review it.`;
    math.classList.add("big","answer");
    math.innerHTML=`\\[${pr.ans}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
    done.add(cur); saveDone();
    $("chip-"+cur).innerHTML = cur + '<span class="tick" aria-label="done">✓</span>';
  }
  PH.forEach((_,i)=>{
    const el=$("ph"+i); el.classList.toggle("now",i===phase); el.classList.toggle("past", phase>=0 && i<phase);
  });

  $("back").disabled = (step===0 && cur===IDS[0]);
  const nb=$("next");
  if(step<n) nb.textContent="Next →";
  else if(step===n) nb.textContent="Show answer →";
  else nb.textContent = IDS[IDS.indexOf(cur)+1] ? `Next problem →` : "Start over";
  typeset([math,ref]);
  try{ history.replaceState(null,"","#p"+cur); }catch(e){}
}

function go(n,s){ cur=n; step=s; render(); }
function next(){
  const n=P[cur].steps.length;
  if(step<=n){ step++; render(); return; }
  const i=IDS.indexOf(cur);
  go(IDS[i+1] ?? IDS[0], 0);
}
function back(){
  if(step>0){ step--; render(); return; }
  const i=IDS.indexOf(cur);
  if(i>0){ const p=IDS[i-1]; go(p, P[p].steps.length+1); }
}
$("next").addEventListener("click",next);
$("back").addEventListener("click",back);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ next(); } else if(e.key==="ArrowLeft"){ back(); }
});

const m = /^#p(\d+)$/.exec(location.hash);
if(m && P[+m[1]]) cur=+m[1];
render();
if(window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(()=>typeset([$("math"),$("ref")]));
</script>
