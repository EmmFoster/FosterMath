*{box-sizing:border-box}

<script>
const H = s => "\\textcolor{#D98A14}{" + s.raw[0] + "}";

const I_RULE = `Remember: <b>√−1 = i</b>. Pull the i out <b>before</b> you do anything else, and write it in front of the radical so nobody thinks it is inside.`;
const SPLIT = `Rewrite the square root of the product as the product of square roots (<b>first property of radicals</b>: √(a · b) = √a · √b).`;
const P = {
 1:{k:"simp", eq:String.raw`\sqrt{32}`, steps:[
  [0,"Check for a negative",`The number under the radical (the <b>radicand</b>) is 32. It is positive, so no i is needed.`,String.raw`\sqrt{32}`],
  [1,"Find the perfect squares",`Rewrite 32 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 32 = 2 · 2 · 2 · 2 · 2 = 2² · 2² · 2.`,String.raw`\sqrt{32} = \sqrt{${H`2^2`} \cdot ${H`2^2`} \cdot 2}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`\sqrt{${H`2^2`}} \cdot \sqrt{${H`2^2`}} \cdot \sqrt{2}`],
  [3,"Simplify the square roots of perfect squares",`√(2²) = <b>2</b>, because 2 · 2 = 2². The √2 is not a perfect square, so it stays.`,String.raw`${H`2`} \cdot ${H`2`} \cdot \sqrt{2}`],
  [4,"Multiply what's outside",`Multiply the numbers in front of the radical: 2 · 2 = <b>4</b>.`,String.raw`${H`4`}\sqrt{2}`]
 ], ans:String.raw`\sqrt{32} = 4\sqrt{2}`},

 2:{k:"simp", eq:String.raw`\sqrt{8}`, steps:[
  [0,"Check for a negative",`The radicand 8 is positive, so no i is needed.`,String.raw`\sqrt{8}`],
  [1,"Find the perfect squares",`Rewrite 8 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 8 = 2 · 2 · 2 = 2² · 2.`,String.raw`\sqrt{8} = \sqrt{${H`2^2`} \cdot 2}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`\sqrt{${H`2^2`}} \cdot \sqrt{2}`],
  [3,"Simplify the square roots of perfect squares",`√(2²) = <b>2</b>. The √2 stays.`,String.raw`${H`2`}\sqrt{2}`]
 ], ans:String.raw`\sqrt{8} = 2\sqrt{2}`},

 3:{k:"simp", eq:String.raw`\sqrt{112}`, steps:[
  [0,"Check for a negative",`The radicand 112 is positive, so no i is needed.`,String.raw`\sqrt{112}`],
  [1,"Find the perfect squares",`Rewrite 112 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 112 = 2 · 2 · 2 · 2 · 7 = 2² · 2² · 7.`,String.raw`\sqrt{112} = \sqrt{${H`2^2`} \cdot ${H`2^2`} \cdot 7}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`\sqrt{${H`2^2`}} \cdot \sqrt{${H`2^2`}} \cdot \sqrt{7}`],
  [3,"Simplify the square roots of perfect squares",`Each √(2²) = <b>2</b>. The √7 stays.`,String.raw`${H`2`} \cdot ${H`2`} \cdot \sqrt{7}`],
  [4,"Multiply what's outside",`2 · 2 = <b>4</b>.`,String.raw`${H`4`}\sqrt{7}`]
 ], ans:String.raw`\sqrt{112} = 4\sqrt{7}`},

 4:{k:"simp", eq:String.raw`\sqrt{-27}`, steps:[
  [0,"Check for a negative",`The radicand is <b>negative</b>. ${I_RULE}`,String.raw`\sqrt{-27} = ${H`i`}\sqrt{27}`],
  [1,"Find the perfect squares",`Rewrite 27 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 27 = 3 · 3 · 3 = 3² · 3.`,String.raw`${H`i`}\sqrt{${H`3^2`} \cdot 3}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`i \cdot \sqrt{${H`3^2`}} \cdot \sqrt{3}`],
  [3,"Simplify the square roots of perfect squares",`√(3²) = <b>3</b>. The √3 stays.`,String.raw`i \cdot ${H`3`} \cdot \sqrt{3}`],
  [4,"Write it neatly",`Put the number first, then i, then the radical.`,String.raw`${H`3i`}\sqrt{3}`]
 ], ans:String.raw`\sqrt{-27} = 3i\sqrt{3}`},

 5:{k:"simp", eq:String.raw`\sqrt{-180}`, steps:[
  [0,"Check for a negative",`The radicand is <b>negative</b>. ${I_RULE}`,String.raw`\sqrt{-180} = ${H`i`}\sqrt{180}`],
  [1,"Find the perfect squares",`Rewrite 180 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 180 = 2 · 2 · 3 · 3 · 5 = 2² · 3² · 5.`,String.raw`i\sqrt{${H`2^2`} \cdot ${H`3^2`} \cdot 5}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`i \cdot \sqrt{${H`2^2`}} \cdot \sqrt{${H`3^2`}} \cdot \sqrt{5}`],
  [3,"Simplify the square roots of perfect squares",`√(2²) = <b>2</b> and √(3²) = <b>3</b>. The √5 stays.`,String.raw`i \cdot ${H`2`} \cdot ${H`3`} \cdot \sqrt{5}`],
  [4,"Multiply what's outside",`2 · 3 = <b>6</b>. Write the number, then i, then the radical.`,String.raw`${H`6i`}\sqrt{5}`]
 ], ans:String.raw`\sqrt{-180} = 6i\sqrt{5}`},

 6:{k:"simp", eq:String.raw`\sqrt{98}`, steps:[
  [0,"Check for a negative",`The radicand 98 is positive, so no i is needed.`,String.raw`\sqrt{98}`],
  [1,"Find the perfect squares",`Rewrite 98 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 98 = 2 · 7 · 7 = 7² · 2.`,String.raw`\sqrt{98} = \sqrt{${H`7^2`} \cdot 2}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`\sqrt{${H`7^2`}} \cdot \sqrt{2}`],
  [3,"Simplify the square roots of perfect squares",`√(7²) = <b>7</b>. The √2 stays.`,String.raw`${H`7`}\sqrt{2}`]
 ], ans:String.raw`\sqrt{98} = 7\sqrt{2}`},

 7:{k:"simp", eq:String.raw`-8\sqrt{16}`, steps:[
  [0,"Check for a negative",`The negative sign belongs to the <b>−8 outside</b> the radical. The radicand 16 is positive, so no i is needed. Keep the −8 and work on √16.`,String.raw`${H`-8`}\sqrt{16}`],
  [1,"Find the perfect squares",`Rewrite 16 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 16 = 2 · 2 · 2 · 2 = 2² · 2².`,String.raw`-8\sqrt{${H`2^2`} \cdot ${H`2^2`}}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`-8 \cdot \sqrt{${H`2^2`}} \cdot \sqrt{${H`2^2`}}`],
  [3,"Simplify the square roots of perfect squares",`Each √(2²) = <b>2</b>. Nothing is left under a radical.`,String.raw`-8 \cdot ${H`2`} \cdot ${H`2`}`],
  [4,"Multiply what's outside",`−8 · 2 · 2 = <b>−32</b>.`,String.raw`${H`-32`}`]
 ], ans:String.raw`-8\sqrt{16} = -32`},

 8:{k:"simp", eq:String.raw`8\sqrt{-196}`, steps:[
  [0,"Check for a negative",`The radicand is <b>negative</b>. ${I_RULE}`,String.raw`8${H`i`}\sqrt{196}`],
  [1,"Find the perfect squares",`Rewrite 196 as a product of prime numbers and identify the perfect squares (numbers multiplied by themselves): 196 = 2 · 2 · 7 · 7 = 2² · 7².`,String.raw`8i\sqrt{${H`2^2`} \cdot ${H`7^2`}}`],
  [2,"Rewrite as a product of square roots",SPLIT,String.raw`8i \cdot \sqrt{${H`2^2`}} \cdot \sqrt{${H`7^2`}}`],
  [3,"Simplify the square roots of perfect squares",`√(2²) = <b>2</b> and √(7²) = <b>7</b>. Nothing is left under a radical.`,String.raw`8i \cdot ${H`2`} \cdot ${H`7`}`],
  [4,"Multiply what's outside",`8 · 2 · 7 = <b>112</b>. Keep the i.`,String.raw`${H`112i`}`]
 ], ans:String.raw`8\sqrt{-196} = 112i`},

 9:{k:"mult", eq:String.raw`\sqrt{15} \cdot -\sqrt{2}`, steps:[
  [0,"Write negatives with i",`Look under each radical: 15 and 2 are both positive, so no i is needed. The minus sign is <b>outside</b> the second radical, so it is just a −1 in front.`,String.raw`\sqrt{15} \cdot (${H`-1`})\sqrt{2}`],
  [1,"Multiply the outside numbers",`The numbers in front are 1 and −1. 1 · (−1) = <b>−1</b>, so the answer is negative.`,String.raw`${H`-`}\sqrt{15} \cdot \sqrt{2}`],
  [2,"Multiply the radicands",`Multiply the numbers under the radicals: √15 · √2 = √(15 · 2) = √30.`,String.raw`-\sqrt{${H`30`}}`],
  [3,"Simplify",`Check 30 for pairs: 30 = 2 · 3 · 5. No factor repeats, so √30 cannot be simplified. You are done.`,String.raw`-\sqrt{30}`]
 ], ans:String.raw`\sqrt{15} \cdot -\sqrt{2} = -\sqrt{30}`},

 10:{k:"mult", eq:String.raw`-\sqrt{8} \cdot 3\sqrt{-2}`, steps:[
  [0,"Write negatives with i",`The second radicand is negative. Rewrite √−2 as i√2 <b>before</b> multiplying. (Multiplying two negative radicands first gives the wrong sign.)`,String.raw`-\sqrt{8} \cdot 3${H`i`}\sqrt{2}`],
  [1,"Multiply the outside numbers",`The numbers in front are −1 and 3: (−1)(3) = <b>−3</b>. Bring the i along.`,String.raw`${H`-3i`}\sqrt{8} \cdot \sqrt{2}`],
  [2,"Multiply the radicands",`√8 · √2 = √(8 · 2) = √16.`,String.raw`-3i\sqrt{${H`16`}}`],
  [3,"Simplify",`16 is a perfect square: √16 = 4. Then −3i · 4 = <b>−12i</b>.`,String.raw`-3i \cdot ${H`4`} = ${H`-12i`}`]
 ], ans:String.raw`-\sqrt{8} \cdot 3\sqrt{-2} = -12i`},

 11:{k:"mult", eq:String.raw`-3\sqrt{2} \cdot 3\sqrt{-4}`, steps:[
  [0,"Write negatives with i",`The second radicand is negative. Rewrite √−4 as i√4.`,String.raw`-3\sqrt{2} \cdot 3${H`i`}\sqrt{4}`],
  [1,"Multiply the outside numbers",`(−3)(3) = <b>−9</b>. Bring the i along.`,String.raw`${H`-9i`}\sqrt{2} \cdot \sqrt{4}`],
  [2,"Multiply the radicands",`√2 · √4 = √(2 · 4) = √8.`,String.raw`-9i\sqrt{${H`8`}}`],
  [3,"Simplify",`8 = 2² · 2, so √8 = 2√2. Then −9i · 2√2 = <b>−18i√2</b>.`,String.raw`-9i \cdot ${H`2`}\sqrt{2} = ${H`-18i`}\sqrt{2}`]
 ], ans:String.raw`-3\sqrt{2} \cdot 3\sqrt{-4} = -18i\sqrt{2}`},

 12:{k:"mult", eq:String.raw`3\sqrt{15} \cdot 3\sqrt{15}`, steps:[
  [0,"Write negatives with i",`Both radicands are 15, which is positive. No i is needed.`,String.raw`3\sqrt{15} \cdot 3\sqrt{15}`],
  [1,"Multiply the outside numbers",`3 · 3 = <b>9</b>.`,String.raw`${H`9`}\sqrt{15} \cdot \sqrt{15}`],
  [2,"Multiply the radicands",`√15 · √15 = √(15²). A square root times itself gives back the number inside.`,String.raw`9\sqrt{${H`15^2`}} = 9 \cdot ${H`15`}`],
  [3,"Simplify",`9 · 15 = <b>135</b>.`,String.raw`${H`135`}`]
 ], ans:String.raw`3\sqrt{15} \cdot 3\sqrt{15} = 135`},

 13:{k:"div", eq:String.raw`\frac{4\sqrt{5}}{\sqrt{2}}`, steps:[
  [0,"Look at the denominator",`A simplified answer cannot have a radical in the denominator. Here the denominator is √2, so we need to <b>rationalize</b> it.`,String.raw`\frac{4\sqrt{5}}{${H`\sqrt{2}`}}`],
  [1,"Multiply by a form of 1",`Multiply top and bottom by √2. Since √2/√2 = 1, the value does not change.`,String.raw`\frac{4\sqrt{5}}{\sqrt{2}} \cdot ${H`\frac{\sqrt{2}}{\sqrt{2}}`}`],
  [2,"Multiply across",`Top: 4√5 · √2 = 4√10. Bottom: √2 · √2 = 2.`,String.raw`\frac{4\sqrt{${H`10`}}}{${H`2`}}`],
  [3,"Simplify",`Divide the <b>outside</b> numbers: 4 ÷ 2 = 2. (Never divide a number outside by a number inside the radical.)`,String.raw`${H`2`}\sqrt{10}`]
 ], ans:String.raw`\frac{4\sqrt{5}}{\sqrt{2}} = 2\sqrt{10}`},

 14:{k:"div", eq:String.raw`\frac{\sqrt{-2}}{\sqrt{3}}`, steps:[
  [0,"Look at the numerator and denominator",`The top radicand is negative, so rewrite √−2 as <b>i√2</b>. The denominator √3 is a radical, so it must be rationalized.`,String.raw`\frac{${H`i`}\sqrt{2}}{\sqrt{3}}`],
  [1,"Multiply by a form of 1",`Multiply top and bottom by √3.`,String.raw`\frac{i\sqrt{2}}{\sqrt{3}} \cdot ${H`\frac{\sqrt{3}}{\sqrt{3}}`}`],
  [2,"Multiply across",`Top: i√2 · √3 = i√6. Bottom: √3 · √3 = 3.`,String.raw`\frac{i\sqrt{${H`6`}}}{${H`3`}}`],
  [3,"Simplify",`There is no number in front of i√6 that shares a factor with 3, so nothing cancels. You are done.`,String.raw`\frac{i\sqrt{6}}{3}`]
 ], ans:String.raw`\frac{\sqrt{-2}}{\sqrt{3}} = \frac{i\sqrt{6}}{3}`},

 15:{k:"div", eq:String.raw`\frac{5}{2\sqrt{2}}`, steps:[
  [0,"Look at the denominator",`The denominator 2√2 has a radical. Only the <b>√2</b> part needs to go; the 2 in front is fine.`,String.raw`\frac{5}{2${H`\sqrt{2}`}}`],
  [1,"Multiply by a form of 1",`Multiply top and bottom by √2 (not by 2√2).`,String.raw`\frac{5}{2\sqrt{2}} \cdot ${H`\frac{\sqrt{2}}{\sqrt{2}}`}`],
  [2,"Multiply across",`Top: 5 · √2 = 5√2. Bottom: 2 · √2 · √2 = 2 · 2 = 4.`,String.raw`\frac{5\sqrt{2}}{${H`4`}}`],
  [3,"Simplify",`5 and 4 have no common factor, so nothing cancels. You are done.`,String.raw`\frac{5\sqrt{2}}{4}`]
 ], ans:String.raw`\frac{5}{2\sqrt{2}} = \frac{5\sqrt{2}}{4}`},

 16:{k:"div", eq:String.raw`\frac{\sqrt{4}}{2\sqrt{5}}`, steps:[
  [0,"Simplify first",`The top is a perfect square: √4 = <b>2</b>.`,String.raw`\frac{${H`2`}}{2\sqrt{5}}`],
  [0,"Cancel common factors",`2 on top and 2 on the bottom cancel: 2 ÷ 2 = 1.`,String.raw`\frac{${H`1`}}{\sqrt{5}}`],
  [1,"Multiply by a form of 1",`The denominator √5 is a radical. Multiply top and bottom by √5.`,String.raw`\frac{1}{\sqrt{5}} \cdot ${H`\frac{\sqrt{5}}{\sqrt{5}}`}`],
  [2,"Multiply across",`Top: 1 · √5 = √5. Bottom: √5 · √5 = 5.`,String.raw`\frac{\sqrt{5}}{${H`5`}}`]
 ], ans:String.raw`\frac{\sqrt{4}}{2\sqrt{5}} = \frac{\sqrt{5}}{5}`},

 17:{k:"conj", eq:String.raw`\frac{4}{2 - \sqrt{2}}`, steps:[
  [0,"Find the conjugate",`The denominator is a <b>binomial</b> with a radical. Its <b>conjugate</b> is the same two terms with the middle sign flipped: 2 − √2 → 2 + √2.`,String.raw`2 - \sqrt{2} \;\to\; ${H`2 + \sqrt{2}`}`],
  [1,"Multiply top and bottom",`Multiply by the conjugate over itself (a form of 1).`,String.raw`\frac{4}{2 - \sqrt{2}} \cdot ${H`\frac{2 + \sqrt{2}}{2 + \sqrt{2}}`}`],
  [2,"Multiply the top",`Distribute the 4: 4 · 2 + 4 · √2.`,String.raw`\frac{${H`8 + 4\sqrt{2}`}}{(2 - \sqrt{2})(2 + \sqrt{2})}`],
  [2,"Multiply the bottom",`Use (a − b)(a + b) = a² − b². The middle terms cancel, and the radical disappears: 2² − (√2)² = 4 − 2 = <b>2</b>.`,String.raw`\frac{8 + 4\sqrt{2}}{2^2 - (\sqrt{2})^2} = \frac{8 + 4\sqrt{2}}{${H`2`}}`],
  [3,"Simplify",`Divide <b>each</b> term on top by 2: 8 ÷ 2 = 4 and 4√2 ÷ 2 = 2√2.`,String.raw`${H`4 + 2\sqrt{2}`}`]
 ], ans:String.raw`\frac{4}{2 - \sqrt{2}} = 4 + 2\sqrt{2}`},

  [2,"Multiply the top",`Distribute the 2: 2 · 2 − 2 · √2.`,String.raw`\frac{${H`4 - 2\sqrt{2}`}}{(2 + \sqrt{2})(2 - \sqrt{2})}`],
  [2,"Multiply the bottom",`a² − b²: 2² − (√2)² = 4 − 2 = <b>2</b>.`,String.raw`\frac{4 - 2\sqrt{2}}{${H`2`}}`],

const IDS = Object.keys(P).map(Number).sort((a,b)=>a-b);

const KINDS = {
  simp:{label:"Simplify", range:"1–8", intro:"Simplify", phases:["Check for a negative","Find the perfect squares","Product of square roots","Simplify perfect squares","Multiply what's outside"], ansTitle:"Simplified", ref:"Original expression"},
  mult:{label:"Multiply radicals", range:"9–12", intro:"Simplify the product", phases:["Write negatives with i","Multiply outside numbers","Multiply radicands","Simplify"], ansTitle:"Simplified", ref:"Original expression"},
  div:{label:"Divide: one radical below", range:"13–16", intro:"Simplify (rationalize the denominator)", phases:["Look at the fraction","Multiply by a form of 1","Multiply across","Simplify"], ansTitle:"Simplified", ref:"Original expression"},
  conj:{label:"Divide: use the conjugate", range:"17–20", intro:"Simplify (rationalize the denominator)", phases:["Find the conjugate","Multiply top and bottom","Multiply out","Simplify"], ansTitle:"Simplified", ref:"Original expression"}
};

let cur = IDS[0], step = 0; // step 0 = problem page, 1..n = steps, n+1 = answer
let done = new Set();
try{ const s = JSON.parse(localStorage.getItem("hw51-done")||"[]"); s.forEach(n=>done.add(n)); }catch(e){}
function saveDone(){ try{ localStorage.setItem("hw51-done", JSON.stringify([...done])); }catch(e){} }

const $ = id => document.getElementById(id);
const picker = $("picker"), phasesEl = $("phases");

Object.entries(KINDS).forEach(([k,info])=>{
  const g=document.createElement("div"); g.className="group";
  g.innerHTML=`<span class="glbl">${info.label} <span class="grng">${info.range}</span></span>`;
  const row=document.createElement("div"); row.className="chips";
  IDS.filter(n=>P[n].k===k).forEach(n=>{
    const b = document.createElement("button");
    b.className="chip"; b.type="button"; b.id="chip-"+n;
    b.addEventListener("click",()=>go(n,0));
    row.appendChild(b);
  });
  g.appendChild(row); picker.appendChild(g);
});

let shownPh=null;
function buildPhases(ph){
  if(shownPh===ph) return; shownPh=ph;
  phasesEl.innerHTML=""; phasesEl.style.setProperty("--cols", ph.length);
  ph.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="phase"; d.id="ph"+i;
    d.innerHTML=`<div class="bar"></div><span>${p}</span>`; phasesEl.appendChild(d);
  });
}

function typeset(els){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.startup.promise.then(()=>{ MathJax.typesetClear(els); return MathJax.typesetPromise(els); }).catch(()=>{});
  }
}

function render(){
  const pr = P[cur], n = pr.steps.length, K = KINDS[pr.k], PH = pr.phases || K.phases;
  buildPhases(PH);
  IDS.forEach(k=>{
    const b=$("chip-"+k);
    b.setAttribute("aria-current", k===cur ? "true":"false");
    b.innerHTML = k + (done.has(k) ? '<span class="tick" aria-label="done">✓</span>' : '');
  });
  const card=$("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  const math=$("math"), ref=$("ref");
  math.className="math";
  let phase=-1;

  if(step===0){
    $("eyebrowL").textContent=`Problem ${cur}`;
    $("eyebrowR").textContent=`${n} steps`;
    $("title").textContent=pr.intro || K.intro;
    $("note").innerHTML=`Try the first step on paper, then press <b style="color:var(--accent)">Next</b> to check it.`;
    math.classList.add("big");
    math.innerHTML=`\\[${pr.eq}\\]`;
    ref.innerHTML="";
  } else if(step<=n){
    const [ph,t,note,tex]=pr.steps[step-1]; phase=ph;
    $("eyebrowL").textContent=`Problem ${cur} · ${PH[ph]}`;
    $("eyebrowR").textContent=`Step ${step} of ${n}`;
    $("title").textContent=t;
    $("note").innerHTML=note;
    math.innerHTML=`\\[${tex}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
  } else {
    phase=PH.length;
    $("eyebrowL").textContent=`Problem ${cur} · Done`;
    $("eyebrowR").textContent=`Done`;
    $("title").textContent=K.ansTitle;
    const nextId = IDS[IDS.indexOf(cur)+1];
    $("note").innerHTML = nextId ? `Nice work. Press <b style="color:var(--accent)">Next problem</b> to go on to problem ${nextId}, or pick any problem above.` : `That was the last problem. Pick any problem above to review it.`;
    math.classList.add("big","answer");
    math.innerHTML=`\\[${pr.ans}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
    done.add(cur); saveDone();
    $("chip-"+cur).innerHTML = cur + '<span class="tick" aria-label="done">✓</span>';
  }
  PH.forEach((_,i)=>{
    const el=$("ph"+i); el.classList.toggle("now",i===phase); el.classList.toggle("past", phase>=0 && i<phase);
  });

  $("back").disabled = (step===0 && cur===IDS[0]);
  const nb=$("next");
  if(step<n) nb.textContent="Next →";
  else if(step===n) nb.textContent="Show answer →";
  else nb.textContent = IDS[IDS.indexOf(cur)+1] ? `Next problem →` : "Start over";
  typeset([math,ref]);
  try{ history.replaceState(null,"","#p"+cur); }catch(e){}
}

function go(n,s){ cur=n; step=s; render(); }
function next(){
  const n=P[cur].steps.length;
  if(step<=n){ step++; render(); return; }
  const i=IDS.indexOf(cur);
  go(IDS[i+1] ?? IDS[0], 0);
}
function back(){
  if(step>0){ step--; render(); return; }
  const i=IDS.indexOf(cur);
  if(i>0){ const p=IDS[i-1]; go(p, P[p].steps.length+1); }
}
$("next").addEventListener("click",next);
$("back").addEventListener("click",back);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ next(); } else if(e.key==="ArrowLeft"){ back(); }
});

const m = /^#p(\d+)$/.exec(location.hash);
if(m && P[+m[1]]) cur=+m[1];
render();
if(window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(()=>typeset([$("math"),$("ref")]));
</script>
