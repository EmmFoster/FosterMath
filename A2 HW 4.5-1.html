<style>
:root{
  --paper:#EEF2EF; --card:#FFFFFF; --ink:#17222C; --muted:#56646E; --line:#D3DCD7;
  --grid:rgba(27,110,122,.07); --accent:#1B6E7A; --accent-ink:#FFFFFF; --accent-soft:#DDEEEF;
  --hl:#B86A00; --hl-soft:#FFF1D9; --done:#2F7D4A;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F161B; --card:#172128; --ink:#E4EBEE; --muted:#95A4AD; --line:#2A3A43;
    --grid:rgba(92,193,204,.07); --accent:#5CC1CC; --accent-ink:#0B1519; --accent-soft:#1D3339;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F161B; --card:#172128; --ink:#E4EBEE; --muted:#95A4AD; --line:#2A3A43;
  --grid:rgba(92,193,204,.07); --accent:#5CC1CC; --accent-ink:#0B1519; --accent-soft:#1D3339;
  --hl:#F2A93B; --hl-soft:#3A2C14; --done:#6BC98A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}

h1{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3.5vw,1.8rem);margin:0;letter-spacing:-.01em;text-wrap:balance}

.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.chip{font-family:var(--display);font-weight:600;font-size:1rem;min-width:46px;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3vw,1.6rem);margin:0;text-wrap:balance}
.note{margin:0;max-width:62ch}
.note b{color:var(--hl)}
.math{border-radius:12px;padding:22px 16px;min-height:110px;display:flex;align-items:center;justify-content:center;overflow-x:auto;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;font-size:1.25rem}
.math mjx-container{margin:0!important}

.btn{font-family:var(--display);font-weight:600;font-size:1.05rem;border-radius:12px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}

@media (max-width:560px){
  .phases{grid-template-columns:repeat(3,1fr);row-gap:10px}

}
@media (prefers-reduced-motion:no-preference){

}
.picker{display:flex;flex-direction:column;align-items:stretch!important;gap:10px}
.group{display:grid;grid-template-columns:16rem 1fr;align-items:center;gap:6px 12px}

.phases{grid-template-columns:repeat(var(--cols,6),1fr)!important}
@media (max-width:560px){.group{grid-template-columns:1fr}.phases{grid-template-columns:repeat(3,1fr)!important}}

<script>
window.MathJax = {

<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script>
const H = s => "\\textcolor{#D98A14}{" + s.raw[0] + "}";

const GCF_NONE = (a,b,c)=>`List the coefficients ${a}, ${b} and ${c}. Their only common factor is 1, and not every term has the variable. <b>No GCF to factor out</b>. The expression is a <b>quadratic trinomial</b> (an expression of the form ax² + bx + c), so it needs to be factored using the <b>AC method</b>.`;
const P = {
 1:{k:"factor", eq:String.raw`4x^2 - 36x + 32`, steps:[
  [0,"First, check for a GCF",`Look at the coefficients 4, −36 and 32. All three are divisible by <b>4</b>. The constant 32 has no x, so x is not part of the GCF.`,String.raw`\text{GCF}(4,\,36,\,32) = ${H`4`}`],
  [0,"Factor out the GCF",`Divide every term by 4: 4x² ÷ 4 = x², −36x ÷ 4 = −9x, 32 ÷ 4 = 8.`,String.raw`${H`4`}\left(x^2 - 9x + 8\right)`],
  [0,"Check what's left",`What is left inside the parentheses is a <b>quadratic trinomial</b> (an expression of the form ax² + bx + c). It needs to be factored using the <b>AC method</b>.`,String.raw`4\left(\textcolor{#D98A14}{x^2 - 9x + 8}\right)`],
  [1,"Identify a, b and c, then multiply a · c",`Read a, b and c from the trinomial inside the parentheses.`,String.raw`a = 1,\; b = -9,\; c = 8 \qquad a \cdot c = 1 \cdot 8 = 8`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 8</b> and <b>add to −9</b>. The product is positive and the sum is negative, so both numbers are negative. Factor pairs of 8: 1 · 8, 2 · 4. The pair −1 and −8 works.`,String.raw`(${H`-1`})(${H`-8`}) = 8 \qquad ${H`-1`} + (${H`-8`}) = -9`],
  [3,"Split the middle term",`Rewrite −9x as −x − 8x.`,String.raw`4\left(x^2 ${H`- x - 8x`} + 8\right)`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, x² − x, factor out <b>x</b>. From the last two terms, −8x + 8, factor out <b>−8</b>. We factor out <b>−8</b> (with its negative sign) so the second parentheses match the first.`,String.raw`4\left[x(x - 1) - 8(x - 1)\right]`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(x − 1)</b>. Because what is inside the parentheses is the same in both terms, <b>(x − 1) is a common factor</b> of the whole expression.`,String.raw`4\left[x(\textcolor{#D98A14}{x - 1}) - 8(\textcolor{#D98A14}{x - 1})\right]`],
  [4,"Factor out the common binomial",`Factor (x − 1) out of both terms. Keep the 4 in front.`,String.raw`4(x - 1)(x - 8)`]
 ], ans:String.raw`4x^2 - 36x + 32 = 4(x - 1)(x - 8)`},

 2:{k:"factor", phases:["First, check for a GCF","Factor out the GCF","Check what's left"], eq:String.raw`2x^2 + 24x`, steps:[
  [0,"First, check for a GCF",`Coefficients 2 and 24 are both divisible by <b>2</b>. Both terms also have an <b>x</b> (lowest power x¹). So the GCF is 2x.`,String.raw`\text{GCF}(2x^2,\; 24x) = ${H`2x`}`],
  [1,"Factor out the GCF",`Divide each term by 2x: 2x² ÷ 2x = x, and 24x ÷ 2x = 12.`,String.raw`${H`2x`}(x + 12)`],
  [2,"Check what's left",`What's left inside the parentheses is a linear binomial (x is not raised to any power greater than 1). It cannot be factored further, so you are done.`,String.raw`2x(x + 12) \;\to\; 2x^2 + 24x \;\checkmark`]
 ], ans:String.raw`2x^2 + 24x = 2x(x + 12)`},

 3:{k:"factor", eq:String.raw`3v^2 + 8v + 5`, steps:[
  [0,"First, check for a GCF",GCF_NONE(3,8,5),String.raw`\text{GCF}(3,\,8,\,5) = 1`],
  [1,"Identify a, b and c, then multiply a · c",`Read the coefficients, then multiply the first and last.`,String.raw`a = 3,\; b = 8,\; c = 5 \qquad a \cdot c = 3 \cdot 5 = 15`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 15</b> and <b>add to 8</b>. Both are positive. Factor pairs of 15: 1 · 15, 3 · 5. The pair 3 and 5 works.`,String.raw`(${H`3`})(${H`5`}) = 15 \qquad ${H`3`} + ${H`5`} = 8`],
  [3,"Split the middle term",`Rewrite 8v as 3v + 5v.`,String.raw`3v^2 ${H`+ 3v + 5v`} + 5`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, 3v² + 3v, factor out <b>3v</b>. From the last two terms, 5v + 5, factor out <b>5</b>.`,String.raw`3v(v + 1) + 5(v + 1)`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(v + 1)</b>. Because what is inside the parentheses is the same in both terms, <b>(v + 1) is a common factor</b> of the whole expression.`,String.raw`3v(\textcolor{#D98A14}{v + 1}) + 5(\textcolor{#D98A14}{v + 1})`],
  [4,"Factor out the common binomial",`Factor (v + 1) out of both terms.`,String.raw`(v + 1)(3v + 5)`]
 ], ans:String.raw`3v^2 + 8v + 5 = (v + 1)(3v + 5)`},

 4:{k:"factor", eq:String.raw`3x^2 - 16x + 21`, steps:[
  [0,"First, check for a GCF",GCF_NONE(3,"−16",21),String.raw`\text{GCF}(3,\,16,\,21) = 1`],
  [1,"Identify a, b and c, then multiply a · c",`Read the coefficients, then multiply the first and last.`,String.raw`a = 3,\; b = -16,\; c = 21 \qquad a \cdot c = 3 \cdot 21 = 63`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 63</b> and <b>add to −16</b>. Product positive, sum negative, so both are negative. Factor pairs of 63: 1 · 63, 3 · 21, 7 · 9. The pair −7 and −9 works.`,String.raw`(${H`-7`})(${H`-9`}) = 63 \qquad ${H`-7`} + (${H`-9`}) = -16`],
  [3,"Split the middle term",`Rewrite −16x as −7x − 9x.`,String.raw`3x^2 ${H`- 7x - 9x`} + 21`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, 3x² − 7x, factor out <b>x</b>. From the last two terms, −9x + 21, factor out <b>−3</b>. We factor out <b>−3</b> (with its negative sign) so the second parentheses match the first.`,String.raw`x(3x - 7) - 3(3x - 7)`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(3x − 7)</b>. Because what is inside the parentheses is the same in both terms, <b>(3x − 7) is a common factor</b> of the whole expression.`,String.raw`x(\textcolor{#D98A14}{3x - 7}) - 3(\textcolor{#D98A14}{3x - 7})`],
  [4,"Factor out the common binomial",`Factor (3x − 7) out of both terms.`,String.raw`(3x - 7)(x - 3)`]
 ], ans:String.raw`3x^2 - 16x + 21 = (3x - 7)(x - 3)`},

 5:{k:"factor", eq:String.raw`4x^2 - 23x + 28`, steps:[
  [0,"First, check for a GCF",GCF_NONE(4,"−23",28),String.raw`\text{GCF}(4,\,23,\,28) = 1`],
  [1,"Identify a, b and c, then multiply a · c",`Read the coefficients, then multiply the first and last.`,String.raw`a = 4,\; b = -23,\; c = 28 \qquad a \cdot c = 4 \cdot 28 = 112`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 112</b> and <b>add to −23</b>. Both are negative. Factor pairs of 112: 1 · 112, 2 · 56, 4 · 28, 7 · 16, 8 · 14. The pair −7 and −16 works.`,String.raw`(${H`-7`})(${H`-16`}) = 112 \qquad ${H`-7`} + (${H`-16`}) = -23`],
  [3,"Split the middle term",`Rewrite −23x as −16x − 7x.`,String.raw`4x^2 ${H`- 16x - 7x`} + 28`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, 4x² − 16x, factor out <b>4x</b>. From the last two terms, −7x + 28, factor out <b>−7</b>. We factor out <b>−7</b> (with its negative sign) so the second parentheses match the first.`,String.raw`4x(x - 4) - 7(x - 4)`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(x − 4)</b>. Because what is inside the parentheses is the same in both terms, <b>(x − 4) is a common factor</b> of the whole expression.`,String.raw`4x(\textcolor{#D98A14}{x - 4}) - 7(\textcolor{#D98A14}{x - 4})`],
  [4,"Factor out the common binomial",`Factor (x − 4) out of both terms.`,String.raw`(x - 4)(4x - 7)`]
 ], ans:String.raw`4x^2 - 23x + 28 = (x - 4)(4x - 7)`},

 6:{k:"factor", eq:String.raw`6k^2 + 11k + 3`, steps:[
  [0,"First, check for a GCF",GCF_NONE(6,11,3),String.raw`\text{GCF}(6,\,11,\,3) = 1`],
  [1,"Identify a, b and c, then multiply a · c",`Read the coefficients, then multiply the first and last.`,String.raw`a = 6,\; b = 11,\; c = 3 \qquad a \cdot c = 6 \cdot 3 = 18`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 18</b> and <b>add to 11</b>. Both are positive. Factor pairs of 18: 1 · 18, 2 · 9, 3 · 6. The pair 2 and 9 works.`,String.raw`(${H`2`})(${H`9`}) = 18 \qquad ${H`2`} + ${H`9`} = 11`],
  [3,"Split the middle term",`Rewrite 11k as 2k + 9k.`,String.raw`6k^2 ${H`+ 2k + 9k`} + 3`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, 6k² + 2k, factor out <b>2k</b>. From the last two terms, 9k + 3, factor out <b>3</b>.`,String.raw`2k(3k + 1) + 3(3k + 1)`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(3k + 1)</b>. Because what is inside the parentheses is the same in both terms, <b>(3k + 1) is a common factor</b> of the whole expression.`,String.raw`2k(\textcolor{#D98A14}{3k + 1}) + 3(\textcolor{#D98A14}{3k + 1})`],
  [4,"Factor out the common binomial",`Factor (3k + 1) out of both terms.`,String.raw`(3k + 1)(2k + 3)`]
 ], ans:String.raw`6k^2 + 11k + 3 = (3k + 1)(2k + 3)`},

 7:{k:"factor", eq:String.raw`3x^2 - 48x + 180`, steps:[
  [0,"First, check for a GCF",`Coefficients 3, −48 and 180 are all divisible by <b>3</b>. (48 = 3 · 16, 180 = 3 · 60.) The constant has no x, so the GCF is 3.`,String.raw`\text{GCF}(3,\,48,\,180) = ${H`3`}`],
  [0,"Factor out the GCF",`Divide every term by 3: 3x² → x², −48x → −16x, 180 → 60.`,String.raw`${H`3`}\left(x^2 - 16x + 60\right)`],
  [0,"Check what's left",`What is left inside the parentheses is a <b>quadratic trinomial</b> (an expression of the form ax² + bx + c). It needs to be factored using the <b>AC method</b>.`,String.raw`3\left(\textcolor{#D98A14}{x^2 - 16x + 60}\right)`],
  [1,"Identify a, b and c, then multiply a · c",`Read a, b and c from the trinomial inside the parentheses.`,String.raw`a = 1,\; b = -16,\; c = 60 \qquad a \cdot c = 1 \cdot 60 = 60`],
  [2,"Find two numbers",`Find two numbers that <b>multiply to 60</b> and <b>add to −16</b>. Both are negative. Factor pairs of 60: 1 · 60, 2 · 30, 3 · 20, 4 · 15, 5 · 12, 6 · 10. The pair −6 and −10 works.`,String.raw`(${H`-6`})(${H`-10`}) = 60 \qquad ${H`-6`} + (${H`-10`}) = -16`],
  [3,"Split the middle term",`Rewrite −16x as −6x − 10x.`,String.raw`3\left(x^2 ${H`- 6x - 10x`} + 60\right)`],
  [4,"Factor the first two terms and the last two terms",`From the first two terms, x² − 6x, factor out <b>x</b>. From the last two terms, −10x + 60, factor out <b>−10</b>. We factor out <b>−10</b> (with its negative sign) so the second parentheses match the first.`,String.raw`3\left[x(x - 6) - 10(x - 6)\right]`],
  [4,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(x − 6)</b>. Because what is inside the parentheses is the same in both terms, <b>(x − 6) is a common factor</b> of the whole expression.`,String.raw`3\left[x(\textcolor{#D98A14}{x - 6}) - 10(\textcolor{#D98A14}{x - 6})\right]`],
  [4,"Factor out the common binomial",`Factor (x − 6) out of both terms. Keep the 3 in front.`,String.raw`3(x - 6)(x - 10)`]
 ], ans:String.raw`3x^2 - 48x + 180 = 3(x - 6)(x - 10)`},

 8:{k:"factor", phases:["First, check for a GCF","Factor out the GCF","Check what's left"], eq:String.raw`4r^3 + 48r^2`, steps:[
  [0,"First, check for a GCF",`Coefficients 4 and 48 are both divisible by <b>4</b>. Both terms have r; the lowest power is <b>r²</b>. So the GCF is 4r².`,String.raw`\text{GCF}(4r^3,\; 48r^2) = ${H`4r^2`}`],
  [1,"Factor out the GCF",`Divide each term by 4r²: 4r³ ÷ 4r² = r, and 48r² ÷ 4r² = 12.`,String.raw`${H`4r^2`}(r + 12)`],
  [2,"Check what's left",`What's left inside the parentheses is a linear binomial (r is not raised to any power greater than 1). It cannot be factored further, so you are done.`,String.raw`4r^2(r + 12) \;\to\; 4r^3 + 48r^2 \;\checkmark`]
 ], ans:String.raw`4r^3 + 48r^2 = 4r^2(r + 12)`},

 9:{k:"solve", eq:String.raw`14k^2 + 23k + 3 = 0`, steps:[
  [0,"Check standard form",`The equation is already in the form ak² + bk + c = 0, with 0 alone on one side.`,String.raw`14k^2 + 23k + 3 = 0`],
  [1,"First, check for a GCF",GCF_NONE(14,23,3),String.raw`\text{GCF}(14,\,23,\,3) = 1`],
  [2,"Identify a, b and c, then multiply a · c",`Read the coefficients, then multiply the first and last.`,String.raw`a = 14,\; b = 23,\; c = 3 \qquad a \cdot c = 14 \cdot 3 = 42`],
  [3,"Find two numbers",`Find two numbers that <b>multiply to 42</b> and <b>add to 23</b>. Both are positive. Factor pairs of 42: 1 · 42, 2 · 21, 3 · 14, 6 · 7. The pair 2 and 21 works.`,String.raw`(${H`2`})(${H`21`}) = 42 \qquad ${H`2`} + ${H`21`} = 23`],
  [4,"Split the middle term",`Rewrite 23k as 2k + 21k.`,String.raw`14k^2 ${H`+ 2k + 21k`} + 3 = 0`],
  [5,"Factor the first two terms and the last two terms",`From the first two terms, 14k² + 2k, factor out <b>2k</b>. From the last two terms, 21k + 3, factor out <b>3</b>.`,String.raw`2k(7k + 1) + 3(7k + 1) = 0`],
  [5,"Spot the common factor",`Look inside the parentheses. Both terms have the same binomial, <b>(7k + 1)</b>. Because what is inside the parentheses is the same in both terms, <b>(7k + 1) is a common factor</b> of the whole expression.`,String.raw`2k(\textcolor{#D98A14}{7k + 1}) + 3(\textcolor{#D98A14}{7k + 1}) = 0`],

const IDS = Object.keys(P).map(Number).sort((a,b)=>a-b);

const KINDS = {
  factor:{label:"Factor completely", range:"1–8", intro:"Factor completely", phases:["First, check for a GCF","Multiply a·c","Find the pair","Split the middle","Factor by grouping"], ansTitle:"Factored completely", ref:"Original expression"},
  solve:{label:"Solve by factoring", range:"9–16", intro:"Solve by factoring", phases:["Standard form","First, check for a GCF","Multiply a·c","Find the pair","Split the middle","Factor by grouping","Solve"], ansTitle:"Solution", ref:"Original equation"}
};

let cur = IDS[0], step = 0; // step 0 = problem page, 1..n = steps, n+1 = answer
let done = new Set();
try{ const s = JSON.parse(localStorage.getItem("hw451-done")||"[]"); s.forEach(n=>done.add(n)); }catch(e){}
function saveDone(){ try{ localStorage.setItem("hw451-done", JSON.stringify([...done])); }catch(e){} }

const $ = id => document.getElementById(id);
const picker = $("picker"), phasesEl = $("phases");

Object.entries(KINDS).forEach(([k,info])=>{
  const g=document.createElement("div"); g.className="group";
  g.innerHTML=`<span class="glbl">${info.label} <span class="grng">${info.range}</span></span>`;
  const row=document.createElement("div"); row.className="chips";
  IDS.filter(n=>P[n].k===k).forEach(n=>{
    const b = document.createElement("button");
    b.className="chip"; b.type="button"; b.id="chip-"+n;
    b.addEventListener("click",()=>go(n,0));
    row.appendChild(b);
  });
  g.appendChild(row); picker.appendChild(g);
});

let shownPh=null;
function buildPhases(ph){
  if(shownPh===ph) return; shownPh=ph;
  phasesEl.innerHTML=""; phasesEl.style.setProperty("--cols", ph.length);
  ph.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="phase"; d.id="ph"+i;
    d.innerHTML=`<div class="bar"></div><span>${p}</span>`; phasesEl.appendChild(d);
  });
}

function typeset(els){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.startup.promise.then(()=>{ MathJax.typesetClear(els); return MathJax.typesetPromise(els); }).catch(()=>{});
  }
}

function render(){
  const pr = P[cur], n = pr.steps.length, K = KINDS[pr.k], PH = pr.phases || K.phases;
  buildPhases(PH);
  IDS.forEach(k=>{
    const b=$("chip-"+k);
    b.setAttribute("aria-current", k===cur ? "true":"false");
    b.innerHTML = k + (done.has(k) ? '<span class="tick" aria-label="done">✓</span>' : '');
  });
  const card=$("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  const math=$("math"), ref=$("ref");
  math.className="math";
  let phase=-1;

  if(step===0){
    $("eyebrowL").textContent=`Problem ${cur}`;
    $("eyebrowR").textContent=`${n} steps`;
    $("title").textContent=pr.intro || K.intro;
    $("note").innerHTML=`Try the first step on paper, then press <b style="color:var(--accent)">Next</b> to check it.`;
    math.classList.add("big");
    math.innerHTML=`\\[${pr.eq}\\]`;
    ref.innerHTML="";
  } else if(step<=n){
    const [ph,t,note,tex]=pr.steps[step-1]; phase=ph;
    $("eyebrowL").textContent=`Problem ${cur} · ${PH[ph]}`;
    $("eyebrowR").textContent=`Step ${step} of ${n}`;
    $("title").textContent=t;
    $("note").innerHTML=note;
    math.innerHTML=`\\[${tex}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
  } else {
    phase=PH.length;
    $("eyebrowL").textContent=`Problem ${cur} · Done`;
    $("eyebrowR").textContent=`Done`;
    $("title").textContent=K.ansTitle;
    const nextId = IDS[IDS.indexOf(cur)+1];
    $("note").innerHTML = nextId ? `Nice work. Press <b style="color:var(--accent)">Next problem</b> to go on to problem ${nextId}, or pick any problem above.` : `That was the last problem. Pick any problem above to review it.`;
    math.classList.add("big","answer");
    math.innerHTML=`\\[${pr.ans}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
    done.add(cur); saveDone();
    $("chip-"+cur).innerHTML = cur + '<span class="tick" aria-label="done">✓</span>';
  }
  PH.forEach((_,i)=>{
    const el=$("ph"+i); el.classList.toggle("now",i===phase); el.classList.toggle("past", phase>=0 && i<phase);
  });

  $("back").disabled = (step===0 && cur===IDS[0]);
  const nb=$("next");
  if(step<n) nb.textContent="Next →";
  else if(step===n) nb.textContent="Show answer →";
  else nb.textContent = IDS[IDS.indexOf(cur)+1] ? `Next problem →` : "Start over";
  typeset([math,ref]);
  try{ history.replaceState(null,"","#p"+cur); }catch(e){}
}

function go(n,s){ cur=n; step=s; render(); }
function next(){
  const n=P[cur].steps.length;
  if(step<=n){ step++; render(); return; }
  const i=IDS.indexOf(cur);
  go(IDS[i+1] ?? IDS[0], 0);
}
function back(){
  if(step>0){ step--; render(); return; }
  const i=IDS.indexOf(cur);
  if(i>0){ const p=IDS[i-1]; go(p, P[p].steps.length+1); }
}
$("next").addEventListener("click",next);
$("back").addEventListener("click",back);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ next(); } else if(e.key==="ArrowLeft"){ back(); }
});

const m = /^#p(\d+)$/.exec(location.hash);
if(m && P[+m[1]]) cur=+m[1];
render();
if(window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(()=>typeset([$("math"),$("ref")]));
</script>
