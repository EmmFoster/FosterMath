<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>A2 HW 5.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#EEF2EF; --card:#FFFFFF; --ink:#17222C; --muted:#56646E; --line:#D3DCD7;
  --grid:rgba(27,110,122,.07); --accent:#1B6E7A; --accent-ink:#FFFFFF; --accent-soft:#DDEEEF;
  --hl:#B86A00; --hl-soft:#FFF1D9; --done:#2F7D4A;
  --display:"Lexend",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F161B; --card:#172128; --ink:#E4EBEE; --muted:#95A4AD; --line:#2A3A43;
    --grid:rgba(92,193,204,.07); --accent:#5CC1CC; --accent-ink:#0B1519; --accent-soft:#1D3339;
    --hl:#F2A93B; --hl-soft:#3A2C14; --done:#6BC98A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F161B; --card:#172128; --ink:#E4EBEE; --muted:#95A4AD; --line:#2A3A43;
  --grid:rgba(92,193,204,.07); --accent:#5CC1CC; --accent-ink:#0B1519; --accent-soft:#1D3339;
  --hl:#F2A93B; --hl-soft:#3A2C14; --done:#6BC98A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3.5vw,1.8rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.picker .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.chip{font-family:var(--display);font-weight:600;font-size:1rem;min-width:46px;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .tick{color:var(--done);font-size:.85rem}
.chip[aria-current="true"] .tick{color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.phase{display:flex;flex-direction:column;gap:6px;font-size:.74rem;color:var(--muted);line-height:1.25}
.phase .bar{height:6px;border-radius:3px;background:var(--line)}
.phase.past .bar{background:var(--accent);opacity:.45}
.phase.now .bar{background:var(--accent)}
.phase.now{color:var(--ink);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3vw,1.6rem);margin:0;text-wrap:balance}
.note{margin:0;max-width:62ch}
.note b{color:var(--hl)}
.math{border-radius:12px;padding:22px 16px;min-height:110px;display:flex;align-items:center;justify-content:center;overflow-x:auto;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;font-size:1.25rem}
.math mjx-container{margin:0!important}
.math.big{font-size:1.7rem;min-height:150px}
.ref{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref .m{font-size:1rem;color:var(--ink)}
.answer{border:2px solid var(--done);background:transparent}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:600;font-size:1.05rem;border-radius:12px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:140px}
.btn.primary:hover{filter:brightness(1.07)}
.kbd{font-size:.8rem;color:var(--muted);text-align:center}
.hlkey{display:inline-block;background:var(--hl-soft);color:var(--hl);border-radius:6px;padding:0 6px;font-weight:700}
@media (max-width:560px){
  .phases{grid-template-columns:repeat(3,1fr);row-gap:10px}
  .math{font-size:1.05rem}
  .math.big{font-size:1.4rem}
  .btn{flex:1}
}
@media (prefers-reduced-motion:no-preference){
  .card.enter{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
.picker{display:flex;flex-direction:column;align-items:stretch!important;gap:10px}
.group{display:grid;grid-template-columns:16rem 1fr;align-items:center;gap:6px 12px}
.glbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grng{color:var(--ink);font-weight:700;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.phases{grid-template-columns:repeat(var(--cols,6),1fr)!important}
@media (max-width:560px){.group{grid-template-columns:1fr}.phases{grid-template-columns:repeat(3,1fr)!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>A2 HW 5.4</h1>
    </div>
    <div class="picker" id="picker" role="group" aria-label="Choose a problem">
          </div>
  </header>

  <div class="phases" id="phases" aria-hidden="true"></div>

  <main class="card" id="card" aria-live="polite">
    <div class="eyebrow"><span id="eyebrowL"></span><span id="eyebrowR"></span></div>
    <h2 id="title"></h2>
    <p class="note" id="note"></p>
    <div class="math" id="math"></div>
    <div class="ref" id="ref"></div>
  </main>

  <div class="nav">
    <button class="btn" id="back" type="button">← Back</button>
    <button class="btn primary" id="next" type="button">Next →</button>
  </div>
  <p class="kbd">Tip: you can also use the ← and → arrow keys. <span class="hlkey">Orange</span> marks the key numbers in each step.</p>
</div>

<script>
window.MathJax = {
  loader: { load: ['[tex]/color'] },
  tex: { packages: {'[+]': ['color']} },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script>
const H = s => "\\textcolor{#D98A14}{" + s.raw[0] + "}";

const I_RULE = `Remember: <b>√−1 = i</b>. Pull the i out <b>before</b> you do anything else, and write it in front of the radical so nobody thinks it is inside.`;
const PM = `Take the square root of both sides. Don't forget the <b>±</b>: a positive number and its opposite both square to the same value, so there are two answers.`;
const BLOCK = `Treat the squared binomial as <b>one block</b>. Do not expand it; undo the operations outside it first.`;
const P = {
 1:{k:"sq", eq:String.raw`2x^2 - 8 = -33`, steps:[
  [0,"Undo the constant",`Add 8 to both sides to get the x² term by itself.`,String.raw`2x^2 = -33 + 8 = ${H`-25`}`],
  [1,"Divide by the coefficient",`Divide both sides by 2. Leave the result as a fraction.`,String.raw`x^2 = ${H`-\frac{25}{2}`}`],
  [2,"Take the square root of both sides",PM,String.raw`x = ${H`\pm`}\sqrt{-\frac{25}{2}}`],
  [3,"Pull out the i",`The number under the radical is <b>negative</b>. ${I_RULE}`,String.raw`x = \pm ${H`i`}\sqrt{\frac{25}{2}}`],
  [3,"Split the fraction",`Use the <b>quotient property</b>: √(a/b) = √a / √b. Then √25 = 5.`,String.raw`x = \pm i\,\frac{\sqrt{25}}{\sqrt{2}} = \pm\frac{${H`5i`}}{\sqrt{2}}`],
  [3,"Rationalize the denominator",`A simplified answer cannot have a radical in the denominator. Multiply top and bottom by √2.`,String.raw`x = \pm\frac{5i}{\sqrt{2}} \cdot ${H`\frac{\sqrt{2}}{\sqrt{2}}`} = \pm\frac{5i\sqrt{2}}{${H`2`}}`]
 ], ans:String.raw`x = \pm\frac{5i\sqrt{2}}{2}`},

 2:{k:"sq", eq:String.raw`100x^2 + 6 = 42`, steps:[
  [0,"Undo the constant",`Subtract 6 from both sides.`,String.raw`100x^2 = 42 - 6 = ${H`36`}`],
  [1,"Divide by the coefficient",`Divide both sides by 100. Leave it as a fraction.`,String.raw`x^2 = ${H`\frac{36}{100}`}`],
  [2,"Take the square root of both sides",PM,String.raw`x = ${H`\pm`}\sqrt{\frac{36}{100}}`],
  [3,"Simplify the square roots",`Split the fraction: √36 / √100. Both are perfect squares: √36 = <b>6</b> and √100 = <b>10</b>.`,String.raw`x = \pm\frac{\sqrt{36}}{\sqrt{100}} = \pm\frac{${H`6`}}{${H`10`}}`],
  [3,"Reduce the fraction",`6 and 10 share a factor of 2: 6/10 = <b>3/5</b>.`,String.raw`x = \pm${H`\frac{3}{5}`}`]
 ], ans:String.raw`x = \pm\frac{3}{5}`},

 3:{k:"sq", eq:String.raw`4x^2 + 6 = -6`, steps:[
  [0,"Undo the constant",`Subtract 6 from both sides.`,String.raw`4x^2 = -6 - 6 = ${H`-12`}`],
  [1,"Divide by the coefficient",`Divide both sides by 4: −12 ÷ 4 = <b>−3</b>.`,String.raw`x^2 = ${H`-3`}`],
  [2,"Take the square root of both sides",PM,String.raw`x = ${H`\pm`}\sqrt{-3}`],
  [3,"Pull out the i",`The number under the radical is <b>negative</b>. ${I_RULE} 3 has no perfect-square factor, so √3 stays.`,String.raw`x = \pm ${H`i`}\sqrt{3}`]
 ], ans:String.raw`x = \pm i\sqrt{3}`},

 4:{k:"sq", eq:String.raw`5 - 5x^2 = -155`, steps:[
  [0,"Undo the constant",`The 5 is written first this time, but it is still the constant. Subtract 5 from both sides.`,String.raw`-5x^2 = -155 - 5 = ${H`-160`}`],
  [1,"Divide by the coefficient",`Divide both sides by <b>−5</b>. A negative divided by a negative is positive: −160 ÷ −5 = 32.`,String.raw`x^2 = \frac{-160}{-5} = ${H`32`}`],
  [2,"Take the square root of both sides",PM,String.raw`x = ${H`\pm`}\sqrt{32}`],
  [3,"Find the perfect squares",`32 = 2 · 2 · 2 · 2 · 2 = 2² · 2² · 2.`,String.raw`x = \pm\sqrt{${H`2^2`} \cdot ${H`2^2`} \cdot 2}`],
  [3,"Simplify the radical",`Each √(2²) = <b>2</b>, and 2 · 2 = <b>4</b>. The √2 stays.`,String.raw`x = \pm ${H`4`}\sqrt{2}`]
 ], ans:String.raw`x = \pm 4\sqrt{2}`},

 5:{k:"sq", eq:String.raw`10x^2 + 1 = 161`, steps:[
  [0,"Undo the constant",`Subtract 1 from both sides.`,String.raw`10x^2 = 161 - 1 = ${H`160`}`],
  [1,"Divide by the coefficient",`Divide both sides by 10.`,String.raw`x^2 = \frac{160}{10} = ${H`16`}`],
  [2,"Take the square root of both sides",PM,String.raw`x = ${H`\pm`}\sqrt{16}`],
  [3,"Simplify",`16 is a perfect square: √16 = <b>4</b>.`,String.raw`x = \pm ${H`4`}`]
 ], ans:String.raw`x = 4 \quad\text{or}\quad x = -4`},

 6:{k:"bin", eq:String.raw`5(x - 1)^2 + 3 = -7`, steps:[
  [0,"Undo the constant",`${BLOCK} Subtract 3 from both sides.`,String.raw`5(x - 1)^2 = -7 - 3 = ${H`-10`}`],
  [1,"Divide by the coefficient",`Divide both sides by 5.`,String.raw`(x - 1)^2 = ${H`-2`}`],
  [2,"Take the square root of both sides",`The square root undoes the square, leaving x − 1. ${PM}`,String.raw`x - 1 = ${H`\pm`}\sqrt{-2}`],
  [3,"Pull out the i",`The number under the radical is <b>negative</b>. ${I_RULE}`,String.raw`x - 1 = \pm ${H`i`}\sqrt{2}`],
  [4,"Solve for x",`Add 1 to both sides. Write the real number first, then ± the imaginary part.`,String.raw`x = ${H`1`} \pm i\sqrt{2}`]
 ], ans:String.raw`x = 1 \pm i\sqrt{2}`},

 7:{k:"bin", eq:String.raw`3(x + 5)^2 - 3 = -15`, steps:[
  [0,"Undo the constant",`${BLOCK} Add 3 to both sides.`,String.raw`3(x + 5)^2 = -15 + 3 = ${H`-12`}`],
  [1,"Divide by the coefficient",`Divide both sides by 3.`,String.raw`(x + 5)^2 = ${H`-4`}`],
  [2,"Take the square root of both sides",`The square root undoes the square, leaving x + 5. ${PM}`,String.raw`x + 5 = ${H`\pm`}\sqrt{-4}`],
  [3,"Pull out the i",`The number under the radical is <b>negative</b>. ${I_RULE} Then √4 = 2.`,String.raw`x + 5 = \pm ${H`2i`}`],
  [4,"Solve for x",`Subtract 5 from both sides.`,String.raw`x = ${H`-5`} \pm 2i`]
 ], ans:String.raw`x = -5 \pm 2i`},

 8:{k:"bin", eq:String.raw`4(x + 3)^2 - 3 = 61`, steps:[
  [0,"Undo the constant",`${BLOCK} Add 3 to both sides.`,String.raw`4(x + 3)^2 = 61 + 3 = ${H`64`}`],
  [1,"Divide by the coefficient",`Divide both sides by 4.`,String.raw`(x + 3)^2 = ${H`16`}`],
  [2,"Take the square root of both sides",`The square root undoes the square, leaving x + 3. ${PM}`,String.raw`x + 3 = ${H`\pm`}\sqrt{16}`],
  [3,"Simplify",`16 is a perfect square: √16 = <b>4</b>.`,String.raw`x + 3 = \pm ${H`4`}`],
  [4,"Solve for x",`Subtract 3 from both sides.`,String.raw`x = ${H`-3`} \pm 4`],
  [4,"Write both answers",`There is no radical or i left, so work out the ± as two separate answers: −3 + 4 = <b>1</b> and −3 − 4 = <b>−7</b>.`,String.raw`x = ${H`1`} \quad\text{or}\quad x = ${H`-7`}`]
 ], ans:String.raw`x = 1 \quad\text{or}\quad x = -7`},

 9:{k:"bin", eq:String.raw`4\left(x - \frac{1}{2}\right)^2 - 5 = 4`, steps:[
  [0,"Undo the constant",`${BLOCK} Add 5 to both sides.`,String.raw`4\left(x - \frac{1}{2}\right)^2 = 4 + 5 = ${H`9`}`],
  [1,"Divide by the coefficient",`Divide both sides by 4. Leave it as a fraction.`,String.raw`\left(x - \frac{1}{2}\right)^2 = ${H`\frac{9}{4}`}`],
  [2,"Take the square root of both sides",`The square root undoes the square, leaving x − ½. ${PM}`,String.raw`x - \frac{1}{2} = ${H`\pm`}\sqrt{\frac{9}{4}}`],
  [3,"Simplify",`Split the fraction: √9 / √4 = <b>3/2</b>. Both are perfect squares.`,String.raw`x - \frac{1}{2} = \pm ${H`\frac{3}{2}`}`],
  [4,"Solve for x",`Add ½ to both sides.`,String.raw`x = ${H`\frac{1}{2}`} \pm \frac{3}{2}`],
  [4,"Write both answers",`The fractions share a denominator, so combine them: ½ + 3/2 = 4/2 = <b>2</b> and ½ − 3/2 = −2/2 = <b>−1</b>.`,String.raw`x = ${H`2`} \quad\text{or}\quad x = ${H`-1`}`]
 ], ans:String.raw`x = 2 \quad\text{or}\quad x = -1`},

 10:{k:"bin", eq:String.raw`2(x - 3)^2 + 4 = -7`, steps:[
  [0,"Undo the constant",`${BLOCK} Subtract 4 from both sides.`,String.raw`2(x - 3)^2 = -7 - 4 = ${H`-11`}`],
  [1,"Divide by the coefficient",`Divide both sides by 2. Leave it as a fraction.`,String.raw`(x - 3)^2 = ${H`-\frac{11}{2}`}`],
  [2,"Take the square root of both sides",`The square root undoes the square, leaving x − 3. ${PM}`,String.raw`x - 3 = ${H`\pm`}\sqrt{-\frac{11}{2}}`],
  [3,"Pull out the i",`The number under the radical is <b>negative</b>. ${I_RULE}`,String.raw`x - 3 = \pm ${H`i`}\sqrt{\frac{11}{2}}`],
  [3,"Split the fraction",`Use the <b>quotient property</b>: √(a/b) = √a / √b. 11 has no perfect-square factor, so √11 stays.`,String.raw`x - 3 = \pm\frac{i\sqrt{11}}{${H`\sqrt{2}`}}`],
  [3,"Rationalize the denominator",`Multiply top and bottom by √2. Top: i√11 · √2 = i√22. Bottom: √2 · √2 = 2.`,String.raw`x - 3 = \pm\frac{i\sqrt{11}}{\sqrt{2}} \cdot ${H`\frac{\sqrt{2}}{\sqrt{2}}`} = \pm\frac{i\sqrt{${H`22`}}}{${H`2`}}`],
  [4,"Solve for x",`Add 3 to both sides. Write the real number first.`,String.raw`x = ${H`3`} \pm \frac{i\sqrt{22}}{2}`]
 ], ans:String.raw`x = 3 \pm \frac{i\sqrt{22}}{2}`}
};
const IDS = Object.keys(P).map(Number).sort((a,b)=>a-b);

const KINDS = {
  sq:{label:"x² by itself", range:"1–5", intro:"Solve by taking square roots", phases:["Undo the constant","Divide by the coefficient","Take ± square root","Simplify"], ansTitle:"Solution", ref:"Original equation"},
  bin:{label:"Squared binomial", range:"6–10", intro:"Solve by taking square roots", phases:["Undo the constant","Divide by the coefficient","Take ± square root","Simplify","Solve for x"], ansTitle:"Solution", ref:"Original equation"}
};

let cur = IDS[0], step = 0; // step 0 = problem page, 1..n = steps, n+1 = answer
let done = new Set();
try{ const s = JSON.parse(localStorage.getItem("hw54-done")||"[]"); s.forEach(n=>done.add(n)); }catch(e){}
function saveDone(){ try{ localStorage.setItem("hw54-done", JSON.stringify([...done])); }catch(e){} }

const $ = id => document.getElementById(id);
const picker = $("picker"), phasesEl = $("phases");

Object.entries(KINDS).forEach(([k,info])=>{
  const g=document.createElement("div"); g.className="group";
  g.innerHTML=`<span class="glbl">${info.label} <span class="grng">${info.range}</span></span>`;
  const row=document.createElement("div"); row.className="chips";
  IDS.filter(n=>P[n].k===k).forEach(n=>{
    const b = document.createElement("button");
    b.className="chip"; b.type="button"; b.id="chip-"+n;
    b.addEventListener("click",()=>go(n,0));
    row.appendChild(b);
  });
  g.appendChild(row); picker.appendChild(g);
});

let shownPh=null;
function buildPhases(ph){
  if(shownPh===ph) return; shownPh=ph;
  phasesEl.innerHTML=""; phasesEl.style.setProperty("--cols", ph.length);
  ph.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="phase"; d.id="ph"+i;
    d.innerHTML=`<div class="bar"></div><span>${p}</span>`; phasesEl.appendChild(d);
  });
}

function typeset(els){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.startup.promise.then(()=>{ MathJax.typesetClear(els); return MathJax.typesetPromise(els); }).catch(()=>{});
  }
}

function render(){
  const pr = P[cur], n = pr.steps.length, K = KINDS[pr.k], PH = pr.phases || K.phases;
  buildPhases(PH);
  IDS.forEach(k=>{
    const b=$("chip-"+k);
    b.setAttribute("aria-current", k===cur ? "true":"false");
    b.innerHTML = k + (done.has(k) ? '<span class="tick" aria-label="done">✓</span>' : '');
  });
  const card=$("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  const math=$("math"), ref=$("ref");
  math.className="math";
  let phase=-1;

  if(step===0){
    $("eyebrowL").textContent=`Problem ${cur}`;
    $("eyebrowR").textContent=`${n} steps`;
    $("title").textContent=pr.intro || K.intro;
    $("note").innerHTML=`Try the first step on paper, then press <b style="color:var(--accent)">Next</b> to check it.`;
    math.classList.add("big");
    math.innerHTML=`\\[${pr.eq}\\]`;
    ref.innerHTML="";
  } else if(step<=n){
    const [ph,t,note,tex]=pr.steps[step-1]; phase=ph;
    $("eyebrowL").textContent=`Problem ${cur} · ${PH[ph]}`;
    $("eyebrowR").textContent=`Step ${step} of ${n}`;
    $("title").textContent=t;
    $("note").innerHTML=note;
    math.innerHTML=`\\[${tex}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
  } else {
    phase=PH.length;
    $("eyebrowL").textContent=`Problem ${cur} · Done`;
    $("eyebrowR").textContent=`Done`;
    $("title").textContent=K.ansTitle;
    const nextId = IDS[IDS.indexOf(cur)+1];
    $("note").innerHTML = nextId ? `Nice work. Press <b style="color:var(--accent)">Next problem</b> to go on to problem ${nextId}, or pick any problem above.` : `That was the last problem. Pick any problem above to review it.`;
    math.classList.add("big","answer");
    math.innerHTML=`\\[${pr.ans}\\]`;
    ref.innerHTML=`${K.ref}: <span class="m">\\(${pr.eq}\\)</span>`;
    done.add(cur); saveDone();
    $("chip-"+cur).innerHTML = cur + '<span class="tick" aria-label="done">✓</span>';
  }
  PH.forEach((_,i)=>{
    const el=$("ph"+i); el.classList.toggle("now",i===phase); el.classList.toggle("past", phase>=0 && i<phase);
  });

  $("back").disabled = (step===0 && cur===IDS[0]);
  const nb=$("next");
  if(step<n) nb.textContent="Next →";
  else if(step===n) nb.textContent="Show answer →";
  else nb.textContent = IDS[IDS.indexOf(cur)+1] ? `Next problem →` : "Start over";
  typeset([math,ref]);
  try{ history.replaceState(null,"","#p"+cur); }catch(e){}
}

function go(n,s){ cur=n; step=s; render(); }
function next(){
  const n=P[cur].steps.length;
  if(step<=n){ step++; render(); return; }
  const i=IDS.indexOf(cur);
  go(IDS[i+1] ?? IDS[0], 0);
}
function back(){
  if(step>0){ step--; render(); return; }
  const i=IDS.indexOf(cur);
  if(i>0){ const p=IDS[i-1]; go(p, P[p].steps.length+1); }
}
$("next").addEventListener("click",next);
$("back").addEventListener("click",back);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ next(); } else if(e.key==="ArrowLeft"){ back(); }
});

const m = /^#p(\d+)$/.exec(location.hash);
if(m && P[+m[1]]) cur=+m[1];
render();
if(window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(()=>typeset([$("math"),$("ref")]));
</script>
