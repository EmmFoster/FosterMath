<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FosterMath</title>
  <meta name="description" content="Welcome to FosterMath by M. Foster.">
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1f2933;
      --muted: #5f6b76;
      --accent: #2f6f5e;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181c;
        --text: #eef1f3;
        --muted: #a3adb6;
        --accent: #6cc3a8;
        --card: #1d2328;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      background: var(--card);
      max-width: 560px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .wave { font-size: 56px; font-weight: 700; color: var(--accent); margin-bottom: 8px; font-family: Georgia, "Times New Roman", serif; }
    h1 { font-size: 2.2rem; margin-bottom: 12px; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 1.05rem; margin-bottom: 28px; }
    .button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .button:hover { opacity: 0.85; }
    .links { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .button.secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="wave">∑</div>
      <h1>Welcome to FosterMath</h1>
      <p>Thanks for stopping by! FosterMath is just getting started — check back soon for math resources and more.</p>
      <div class="links">
        <a class="button" href="AbsoluteValueFlashCards.html">Absolute Value Flash Cards</a>
      </div>
      <div class="links">
        <a class="button" href="A2H HW 4.5 coach.html">A2H HW 4.5</a>
      </div>
    </div>
  </main>
  <footer>
    &copy; <span id="year"></span> M. Foster · FosterMath
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
